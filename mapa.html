<!DOCTYPE html>
<html lang="es-AR" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vecinos afectados | Emergencia El Niño · Las Toscas</title>
  <meta name="description" content="Mapa de vecinos de Las Toscas afectados por el agua: quiénes necesitan ayuda y cómo contactarlos.">
  <meta name="theme-color" content="#0b2a4a">
  <script>try{var t=localStorage.getItem("lt-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark-mode")}catch(e){}</script>
  <link rel="icon" type="image/png" href="assets/img/escudo-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/emergencia.css">
</head>
<body>
  <div id="em-header" data-volver="index.html"></div>

  <main id="main" class="em-wrap">
    <div class="em-page-head">
      <h1>Vecinos afectados</h1>
      <p>Tocá un punto para ver los datos y llamar. <b>Los rojos son urgentes.</b></p>
    </div>

    <div class="em-filters" role="group" aria-label="Filtrar por gravedad">
      <button class="em-filter is-active" type="button" data-f="todos" aria-pressed="true">Todos <b id="cTodos"></b></button>
      <button class="em-filter" type="button" data-f="urgente" aria-pressed="false"><i class="fa-solid fa-triangle-exclamation"></i>Urgentes <b id="cUrg"></b></button>
      <button class="em-filter" type="button" data-f="leve" aria-pressed="false"><i class="fa-solid fa-droplet"></i>Leves <b id="cLeve"></b></button>
    </div>
    <label class="em-toggle-done"><input type="checkbox" id="verAtendidos"> Mostrar también los ya atendidos</label>

    <div class="em-maplayout">
      <div>
        <div class="em-map" id="mapa" aria-label="Mapa de vecinos afectados"></div>
        <div class="em-legend" aria-hidden="true">
          <span><i class="em-dot em-dot--urg"></i>Urgente</span>
          <span><i class="em-dot em-dot--leve"></i>Leve</span>
          <span><i class="em-dot em-dot--ok"></i>Atendido</span>
        </div>
      </div>
      <section aria-labelledby="t-lista">
        <h2 id="t-lista" class="sr-only">Lista de vecinos afectados</h2>
        <div class="em-list" id="lista"></div>
      </section>
    </div>

    <div class="em-done__actions" style="margin-bottom:24px">
      <a class="em-btn em-btn--urg" href="reportar.html"><i class="fa-solid fa-house-flood-water"></i>Yo también estoy afectado</a>
    </div>
  </main>

  <div id="em-footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="assets/js/datos.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/mapa.js"></script>
</body>
</html>
