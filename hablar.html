<!DOCTYPE html>
<html lang="es-AR" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Avisar hablando | Emergencia El Niño · Las Toscas</title>
  <meta name="description" content="Avisá por audio que tu casa está afectada por el agua. Una asistente te hace preguntas cortas y vos contestás hablando.">
  <meta name="theme-color" content="#0b2a4a">
  <script>try{var t=localStorage.getItem("lt-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark-mode")}catch(e){}</script>
  <link rel="icon" type="image/png" href="assets/img/escudo-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/emergencia.css">
</head>
<body class="em-chatpage">
  <div id="em-header" data-volver="index.html"></div>

  <main id="main" class="em-chat">
    <div class="em-chat__who">
      <span class="em-chat__avatar"><img src="assets/img/escudo-256.png" alt=""></span>
      <span><b>Asistente de Emergencia</b><small id="estadoAsistente">en línea</small></span>
    </div>

    <div class="em-chat__msgs" id="msgs" role="log" aria-live="polite" aria-label="Conversación con la asistente"></div>

    <div class="em-chat__bar" id="barra">
      <p class="em-chat__hint" id="pista" aria-live="assertive"></p>

      <!-- Botón principal: micrófono / enviar -->
      <div class="em-chat__mic-row" id="filaMic">
        <button class="em-chat__cancel" type="button" id="cancelar" hidden aria-label="Cancelar audio"><i class="fa-solid fa-trash-can"></i><span>Borrar</span></button>
        <div class="em-chat__mic-wrap">
          <button class="em-chat__mic" type="button" id="mic" aria-label="Tocá para hablar"><i class="fa-solid fa-microphone"></i></button>
          <span class="em-chat__mic-label" id="micLabel">Tocá para hablar</span>
        </div>
        <span class="em-chat__timer" id="reloj" hidden>0:00</span>
      </div>

      <!-- Alternativa escrita -->
      <form class="em-chat__type" id="formTexto" hidden autocomplete="off">
        <input type="text" id="texto" placeholder="Escribí tu respuesta…" aria-label="Tu respuesta">
        <button class="em-chat__send" type="submit" aria-label="Enviar"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
      <button class="em-chat__switch" type="button" id="cambiarModo"><i class="fa-solid fa-keyboard"></i><span>Prefiero escribir</span></button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"><i class="fa-solid fa-circle-check"></i><span></span></div>

  <script src="assets/js/datos.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/voz-prompt.js"></script>
  <script src="assets/js/hablar.js"></script>
</body>
</html>
